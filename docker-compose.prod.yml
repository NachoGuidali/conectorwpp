version: '3.9'

# Override de producción para ras.supregsolutions.com
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:

  web:
    ports:
      - "127.0.0.1:8004:8000"   # Nginx proxy → 127.0.0.1:8004

  evolution-api:
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      - SERVER_URL=https://ras.supregsolutions.com
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/1
