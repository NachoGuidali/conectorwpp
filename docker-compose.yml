version: '3.9'

# Base — sin puertos expuestos al host.
# Para local: agregar docker-compose.local.yml
# Para prod:  agregar docker-compose.prod.yml

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waply}
      POSTGRES_USER: ${POSTGRES_USER:-waply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waply123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      - SERVER_URL=${PUBLIC_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-changeme}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-waply}:${POSTGRES_PASSWORD:-waply123}@db:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      - db
      - redis
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_files:/app/staticfiles
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery:
    build: .
    command: celery -A config worker -l info -Q default,whatsapp
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  evolution_instances:
  evolution_store:
